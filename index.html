<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Navigation</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<style>
*{box-sizing:border-box}html,body,#map{width:100%;height:100%;margin:0}body{overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif}#map{position:absolute;inset:0}.panel{position:absolute;z-index:10;top:max(14px,env(safe-area-inset-top));left:14px;width:400px;max-width:calc(100% - 28px);padding:16px;background:rgba(255,255,255,.97);border-radius:22px;box-shadow:0 8px 30px rgba(0,0,0,.16)}.title{font-size:21px;font-weight:750;margin-bottom:12px}.row{position:relative;display:flex;align-items:center;gap:9px;margin-bottom:9px}.dot{width:18px;text-align:center}.startDot{color:#1683ff}.endDot{color:#ef4444}input{flex:1;min-width:0;height:48px;padding:0 14px;border:1px solid #e1e4e8;border-radius:14px;background:#f6f7f9;outline:none;font-size:16px}input:focus{background:#fff;border-color:#1683ff}.results{display:none;position:absolute;z-index:100;top:51px;left:27px;right:0;max-height:280px;overflow:auto;background:#fff;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.22)}.item{padding:12px 14px;border-bottom:1px solid #eee;cursor:pointer}.item:last-child{border-bottom:0}.itemTitle{font-size:14px;font-weight:650}.itemAddress{margin-top:4px;color:#777;font-size:11px;line-height:1.45}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.mode{height:43px;border:0;border-radius:13px;background:#f0f2f5;cursor:pointer;font-size:14px}.mode.active{background:#1683ff;color:#fff}.plan{width:100%;height:50px;margin-top:12px;border:0;border-radius:15px;background:#1683ff;color:#fff;cursor:pointer;font-size:16px;font-weight:700}.routeInfo{display:none;margin-top:13px;padding-top:13px;border-top:1px solid #eee}.routeTop{display:flex;align-items:flex-end;justify-content:space-between}.time{font-size:28px;font-weight:750;color:#1683ff}.distance{color:#666;font-size:15px}.desc{margin-top:5px;color:#888;font-size:12px}.navButton{width:100%;height:48px;margin-top:12px;border:0;border-radius:14px;background:#18a05e;color:#fff;cursor:pointer;font-size:15px;font-weight:700}.tools{position:absolute;z-index:10;top:max(14px,env(safe-area-inset-top));right:14px;display:flex;flex-direction:column;gap:10px}.tool{height:52px;padding:0 15px;border:0;border-radius:16px;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.16);cursor:pointer;font-weight:650}.mapMenu{display:none;position:absolute;z-index:20;right:14px;top:78px;width:210px;padding:10px;background:#fff;border-radius:18px;box-shadow:0 8px 28px rgba(0,0,0,.22)}.mapMenu.show{display:block}.mapOption{width:100%;padding:12px;border:0;border-radius:12px;background:transparent;cursor:pointer;text-align:left}.toast{position:absolute;z-index:200;left:50%;bottom:max(28px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:11px 18px;border-radius:22px;background:rgba(20,20,20,.88);color:#fff;font-size:13px;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}.toast.show{opacity:1}@media(max-width:650px){.panel{top:max(8px,env(safe-area-inset-top));left:8px;width:calc(100% - 16px);max-width:none;padding:12px;border-radius:18px}.title{display:none}.row{margin-bottom:7px}.modes{margin-top:9px}.mode{height:39px}.plan{height:46px;margin-top:9px}.tools{top:auto;right:10px;bottom:max(20px,env(safe-area-inset-bottom))}.mapMenu{top:auto;right:74px;bottom:max(20px,env(safe-area-inset-bottom))}}
</style>
</head><body>
<div id="map"></div>
<div class="panel"><div class="title">路線規劃</div><div class="row"><div class="dot startDot">●</div><input id="startInput" placeholder="輸入起點" autocomplete="off"><div id="startResults" class="results"></div></div><div class="row"><div class="dot endDot">●</div><input id="endInput" placeholder="你要去哪裡？" autocomplete="off"><div id="endResults" class="results"></div></div><div class="modes"><button id="car" class="mode active" onclick="setMode('car')">🚗 開車</button><button id="motorcycle" class="mode" onclick="setMode('motorcycle')">🛵 機車</button><button id="walk" class="mode" onclick="setMode('walk')">🚶 步行</button></div><button class="plan" onclick="planRoute()">規劃路線</button><div id="routeInfo" class="routeInfo"><div class="routeTop"><div id="time" class="time"></div><div id="distance" class="distance"></div></div><div id="desc" class="desc"></div><button class="navButton" onclick="navigationView()">開始導航</button></div></div>
<div class="tools"><button class="tool" onclick="toggleMapMenu()">🗺 地圖</button><button class="tool" onclick="fitRoute()">◇ 路線</button></div>
<div id="mapMenu" class="mapMenu"><button class="mapOption" onclick="changeStyle('bright')">☀️ Bright</button><button class="mapOption" onclick="changeStyle('liberty')">🗺 Liberty</button><button class="mapOption" onclick="changeStyle('dark')">🌙 夜間</button></div><div id="toast" class="toast"></div>
<script>
const styles={bright:"https://tiles.openfreemap.org/styles/bright",liberty:"https://tiles.openfreemap.org/styles/liberty",dark:"https://tiles.openfreemap.org/styles/dark"};
const map=new maplibregl.Map({container:"map",style:styles.bright,center:[120.6839,24.1477],zoom:12.5});map.addControl(new maplibregl.NavigationControl(),"bottom-right");
let startPlace=null,endPlace=null,startMarker=null,endMarker=null,routeCoordinates=null,mode="car";const timers={};
setupSearch("startInput","startResults","start");setupSearch("endInput","endResults","end");
function setupSearch(inputID,resultID,type){const input=document.getElementById(inputID),box=document.getElementById(resultID);input.addEventListener("input",()=>{clearTimeout(timers[type]);const keyword=input.value.trim();if(keyword.length<2){box.style.display="none";return}timers[type]=setTimeout(()=>searchPlace(keyword,box,type),650)});input.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();const keyword=input.value.trim();if(keyword)searchPlace(keyword,box,type)}})}
async function searchPlace(keyword,box,type){box.innerHTML='<div class="item">搜尋中…</div>';box.style.display="block";const queries=buildQueries(keyword);let places=[];try{for(const query of queries){const url="https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=tw&limit=8&addressdetails=1&accept-language=zh-TW&q="+encodeURIComponent(query);const response=await fetch(url);if(!response.ok)continue;const data=await response.json();if(data.length){places=data;break}await sleep(1050)}if(!places.length){box.innerHTML='<div class="item"><div class="itemTitle">找不到「'+safe(keyword)+'」</div><div class="itemAddress">免費 OSM 地址資料可能沒有這筆台灣門牌</div></div>';return}box.innerHTML="";places.forEach(place=>{const row=document.createElement("div");row.className="item";const title=place.name||getAddressTitle(place)||keyword;row.innerHTML='<div class="itemTitle">'+safe(title)+'</div><div class="itemAddress">'+safe(place.display_name)+'</div>';row.onclick=()=>choosePlace(place,type,box,title);box.appendChild(row)})}catch(e){box.innerHTML='<div class="item">搜尋服務目前無法使用</div>'}}
function buildQueries(keyword){let q=keyword.trim().replaceAll("台中","臺中").replaceAll("台北","臺北").replaceAll("台南","臺南").replaceAll("台東","臺東");const list=[q];if(!/[縣市]/.test(q))list.push("臺中市 "+q);return[...new Set(list)]}
function getAddressTitle(place){const a=place.address||{};if(a.road&&a.house_number)return a.road+a.house_number;return a.road||a.suburb||a.city_district||""}
function choosePlace(place,type,box,title){const data={lng:Number(place.lon),lat:Number(place.lat),name:title,address:place.display_name};box.style.display="none";if(type==="start"){startPlace=data;document.getElementById("startInput").value=title;if(startMarker)startMarker.remove();startMarker=new maplibregl.Marker({color:"#1683ff"}).setLngLat([data.lng,data.lat]).addTo(map)}else{endPlace=data;document.getElementById("endInput").value=title;if(endMarker)endMarker.remove();endMarker=new maplibregl.Marker({color:"#ef4444"}).setLngLat([data.lng,data.lat]).addTo(map)}map.flyTo({center:[data.lng,data.lat],zoom:16})}
function setMode(value){mode=value;document.querySelectorAll(".mode").forEach(b=>b.classList.remove("active"));document.getElementById(value).classList.add("active");if(value!=="car")toast(value==="motorcycle"?"機車目前為測試模式":"步行目前為測試模式")}
async function planRoute(){if(!startPlace){toast("請先選擇起點");return}if(!endPlace){toast("請先選擇目的地");return}toast("正在規劃路線…");const url="https://router.project-osrm.org/route/v1/driving/"+startPlace.lng+","+startPlace.lat+";"+endPlace.lng+","+endPlace.lat+"?overview=full&geometries=geojson&steps=true";try{const response=await fetch(url),data=await response.json();if(!data.routes||!data.routes.length){toast("找不到可用路線");return}const route=data.routes[0];routeCoordinates=route.geometry.coordinates;drawRoute();showRouteInfo(route.distance,route.duration)}catch(e){toast("路線服務目前無法使用")}}
function removeRoute(){if(map.getLayer("route-line"))map.removeLayer("route-line");if(map.getLayer("route-outline"))map.removeLayer("route-outline");if(map.getSource("route"))map.removeSource("route")}
function drawRoute(){if(!routeCoordinates)return;removeRoute();map.addSource("route",{type:"geojson",data:{type:"Feature",properties:{},geometry:{type:"LineString",coordinates:routeCoordinates}}});map.addLayer({id:"route-outline",type:"line",source:"route",layout:{"line-join":"round","line-cap":"round"},paint:{"line-color":"#fff","line-width":12}});map.addLayer({id:"route-line",type:"line",source:"route",layout:{"line-join":"round","line-cap":"round"},paint:{"line-color":"#1683ff","line-width":7}});fitRoute()}
function fitRoute(){if(!routeCoordinates){toast("目前沒有路線");return}const bounds=new maplibregl.LngLatBounds();routeCoordinates.forEach(p=>bounds.extend(p));const mobile=window.innerWidth<=650;map.fitBounds(bounds,{padding:mobile?{top:260,right:45,bottom:80,left:45}:{top:70,right:80,bottom:70,left:440},duration:900})}
function showRouteInfo(meters,seconds){document.getElementById("time").textContent=Math.max(1,Math.round(seconds/60))+" 分鐘";document.getElementById("distance").textContent=(meters/1000).toFixed(1)+" 公里";const names={car:"開車",motorcycle:"機車（測試）",walk:"步行（測試）"};document.getElementById("desc").textContent=names[mode]+"｜"+startPlace.name+" → "+endPlace.name;document.getElementById("routeInfo").style.display="block"}
function navigationView(){if(!routeCoordinates){toast("請先規劃路線");return}let bearing=0;if(routeCoordinates.length>1)bearing=getBearing(routeCoordinates[0],routeCoordinates[1]);map.easeTo({center:[startPlace.lng,startPlace.lat],zoom:17.5,pitch:60,bearing,duration:1200});toast("導航視角")}
function getBearing(a,b){const lon1=a[0]*Math.PI/180,lat1=a[1]*Math.PI/180,lon2=b[0]*Math.PI/180,lat2=b[1]*Math.PI/180,y=Math.sin(lon2-lon1)*Math.cos(lat2),x=Math.cos(lat1)*Math.sin(lat2)-Math.sin(lat1)*Math.cos(lat2)*Math.cos(lon2-lon1);return(Math.atan2(y,x)*180/Math.PI+360)%360}
function toggleMapMenu(){document.getElementById("mapMenu").classList.toggle("show")}
function changeStyle(name){const center=map.getCenter(),zoom=map.getZoom(),bearing=map.getBearing(),pitch=map.getPitch();map.setStyle(styles[name]);map.once("style.load",()=>{map.jumpTo({center,zoom,bearing,pitch});if(routeCoordinates)drawRoute()});document.getElementById("mapMenu").classList.remove("show")}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}function toast(message){const el=document.getElementById("toast");el.textContent=message;el.classList.add("show");clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove("show"),2500)}function safe(text){const d=document.createElement("div");d.textContent=text||"";return d.innerHTML}
map.on("click",()=>{document.getElementById("startResults").style.display="none";document.getElementById("endResults").style.display="none";document.getElementById("mapMenu").classList.remove("show")});
</script></body></html>
