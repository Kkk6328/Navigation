<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e9f1f8"><title>Navigation</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css"><script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script><style>
*{box-sizing:border-box}html,body,#map{width:100%;height:100%;margin:0}body{overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif}#map{position:absolute;inset:0}.panel{position:absolute;z-index:10;top:max(14px,env(safe-area-inset-top));left:14px;width:400px;max-width:calc(100% - 28px);padding:16px;background:rgba(255,255,255,.97);border-radius:22px;box-shadow:0 8px 30px #0002}.title{font-size:21px;font-weight:800;margin-bottom:12px}.row{position:relative;display:flex;align-items:center;gap:9px;margin-bottom:9px}.dot{width:18px;text-align:center}.startDot{color:#1683ff}.endDot{color:#ef4444}input{flex:1;min-width:0;height:48px;padding:0 14px;border:1px solid #e1e4e8;border-radius:14px;background:#f6f7f9;outline:none;font-size:16px}.results{display:none;position:absolute;z-index:100;top:51px;left:27px;right:0;max-height:280px;overflow:auto;background:#fff;border-radius:14px;box-shadow:0 8px 28px #0003}.item{padding:12px 14px;border-bottom:1px solid #eee}.itemTitle{font-size:14px;font-weight:700}.itemAddress{margin-top:4px;color:#777;font-size:11px}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.mode,.plan,.navButton{border:0;cursor:pointer;font-weight:700}.mode{height:43px;border-radius:13px;background:#f0f2f5}.mode.active,.plan{background:#1683ff;color:#fff}.plan{width:100%;height:50px;margin-top:12px;border-radius:15px;font-size:16px}.routeInfo{display:none;margin-top:13px;padding-top:13px;border-top:1px solid #eee}.routeTop{display:flex;align-items:flex-end;justify-content:space-between}.time{font-size:28px;font-weight:800;color:#1683ff}.distance{color:#666}.desc{margin-top:5px;color:#888;font-size:12px}.navButton{width:100%;height:48px;margin-top:12px;border-radius:14px;background:#18a05e;color:#fff;font-size:15px}.tools{position:absolute;z-index:10;top:max(14px,env(safe-area-inset-top));right:14px;display:flex;flex-direction:column;gap:10px}.tool{height:52px;padding:0 15px;border:0;border-radius:16px;background:#fff;box-shadow:0 4px 18px #0002;font-weight:700}.navUI{display:none;position:absolute;inset:0;z-index:30;pointer-events:none}.navUI.on{display:block}.instruction{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;min-height:94px;padding:15px 18px 14px 88px;border-radius:20px;background:#0e1a31;color:#fff;box-shadow:0 6px 22px #0004}.turnIcon{position:absolute;left:18px;top:15px;font-size:48px;font-weight:900}.nextDist{font-size:17px;font-weight:700;color:#b9c7dc}.nextRoad{font-size:24px;font-weight:900;line-height:1.15;margin-top:3px}.gpsCar{position:absolute;left:50%;top:68%;width:48px;height:48px;margin:-24px;border:5px solid #fff;border-radius:50%;background:#1683ff;box-shadow:0 3px 12px #0005;display:grid;place-items:center;font-size:25px;transform:rotate(0deg)}.navSide{position:absolute;left:12px;top:35%;display:grid;gap:8px;pointer-events:auto}.navSide button{width:62px;height:62px;border:0;border-radius:15px;background:#fff;box-shadow:0 3px 14px #0002;font-size:12px;font-weight:800}.navBottom{position:absolute;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));height:112px;border-radius:22px;background:rgba(255,255,255,.97);box-shadow:0 -3px 18px #0002;display:grid;grid-template-columns:72px 1fr 72px;align-items:center;pointer-events:auto}.exitBtn{border:0;background:none;font-size:29px;font-weight:900}.exitBtn small{display:block;font-size:12px}.remain{text-align:center}.remain strong{display:block;color:#1683ff;font-size:26px}.remain span{font-size:13px;color:#666}.overviewBtn{border:0;background:none;font-size:25px}.overviewBtn small{display:block;font-size:12px}.gpsStatus{position:absolute;right:12px;top:125px;background:#fff;padding:8px 12px;border-radius:14px;font-size:12px;box-shadow:0 3px 12px #0002}.toast{position:absolute;z-index:200;left:50%;bottom:28px;transform:translateX(-50%);padding:11px 18px;border-radius:22px;background:#111e;color:#fff;opacity:0;transition:.2s;white-space:nowrap}.toast.show{opacity:1}.navMode .panel,.navMode .tools,.navMode .maplibregl-ctrl{display:none!important}
.instruction{top:max(10px,env(safe-area-inset-top));left:10px;right:10px;min-height:76px;padding:11px 16px 11px 68px;border-radius:18px;background:rgba(12,25,48,.96);box-shadow:0 5px 20px #0004;backdrop-filter:blur(14px)}.turnIcon{left:17px;top:12px;width:38px;text-align:center;font-size:38px}.nextDist{font-size:14px}.nextRoad{font-size:20px;font-weight:850;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gpsCar{width:42px;height:42px;margin:-21px;border-width:4px;font-size:21px}.navSide{left:10px;top:38%}.navSide button{width:52px;height:52px;background:rgba(255,255,255,.94);font-size:11px;backdrop-filter:blur(10px)}.navBottom{height:92px;background:rgba(255,255,255,.94);grid-template-columns:64px 1fr 64px;backdrop-filter:blur(16px)}.exitBtn{color:#1683ff;font-size:25px}.exitBtn small,.overviewBtn small{font-size:11px}.remain strong{font-size:24px}.remain span{font-size:12px}.overviewBtn{color:#1683ff;font-size:22px}.gpsStatus{right:10px;top:98px;padding:6px 10px;background:rgba(255,255,255,.92);font-size:11px;backdrop-filter:blur(10px)}
.speedometer{position:absolute;right:10px;top:134px;width:68px;height:68px;border:5px solid #1683ff;border-radius:50%;background:rgba(255,255,255,.96);display:grid;place-content:center;text-align:center;box-shadow:0 4px 16px #0003}.speedometer.over{border-color:#ef4444;color:#ef4444}.speedometer strong{font-size:24px;line-height:1}.speedometer small{margin-top:3px;font-size:9px;color:#667}.cameraAlert{display:none;position:absolute;top:98px;left:10px;max-width:calc(100% - 100px);padding:7px 11px;border-radius:13px;background:#ff9500;color:#fff;font-size:12px;font-weight:800;box-shadow:0 3px 12px #0003}.cameraAlert.on{display:block}
@media(max-width:650px){.panel{top:max(8px,env(safe-area-inset-top));left:8px;width:calc(100% - 16px);max-width:none;padding:12px;border-radius:18px}.title{display:none}.row{margin-bottom:7px}.modes{margin-top:9px}.mode{height:39px}.plan{height:46px;margin-top:9px}.tools{top:auto;right:10px;bottom:max(20px,env(safe-area-inset-bottom))}}
</style></head><body><div id="map"></div><div class="panel"><div class="title">路線規劃</div><div class="row"><div class="dot startDot">●</div><input id="startInput" placeholder="輸入起點" autocomplete="off"><div id="startResults" class="results"></div></div><div class="row"><div class="dot endDot">●</div><input id="endInput" placeholder="你要去哪裡？" autocomplete="off"><div id="endResults" class="results"></div></div><div class="modes"><button id="car" class="mode active" onclick="setMode('car')">🚗 開車</button><button id="motorcycle" class="mode" onclick="setMode('motorcycle')">🛵 機車</button><button id="walk" class="mode" onclick="setMode('walk')">🚶 步行</button></div><button class="plan" onclick="planRoute()">規劃路線</button><div id="routeInfo" class="routeInfo"><div class="routeTop"><div id="time" class="time"></div><div id="distance" class="distance"></div></div><div id="desc" class="desc"></div><button class="navButton" onclick="startNavigation()">開始導航</button></div></div><div class="tools"><button class="tool" onclick="fitRoute()">◇ 路線</button></div>
<div id="navUI" class="navUI"><div class="instruction"><div id="turnIcon" class="turnIcon">↑</div><div id="nextDist" class="nextDist">準備出發</div><div id="nextRoad" class="nextRoad">請沿規劃路線行駛</div></div><div id="gpsStatus" class="gpsStatus">GPS 定位中…</div><div id="speedometer" class="speedometer"><strong id="speedValue">0</strong><small>km/h</small></div><div id="cameraAlert" class="cameraAlert"></div><div id="gpsCar" class="gpsCar">▲</div><div class="navSide"><button onclick="recenter()">◎<br>定位</button><button onclick="fitRoute()">⌁<br>全覽</button></div><div class="navBottom"><button class="exitBtn" onclick="stopNavigation()">×<small>退出</small></button><div class="remain"><strong id="remainTime">-- 分鐘</strong><span id="remainDistance">-- 公里</span></div><button class="overviewBtn" onclick="fitRoute()">⌘<small>全覽</small></button></div></div><div id="toast" class="toast"></div>
<script>
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/bright',center:[120.6839,24.1477],zoom:12.5});map.addControl(new maplibregl.NavigationControl(),'bottom-right');let startPlace=null,endPlace=null,startMarker=null,endMarker=null,routeCoordinates=null,routeData=null,routeSteps=[],mode='car',watchId=null,currentPos=null,lastHeading=0,gpsStart=false,manualStartOverride=false,currentSpeed=0,speedCameras=[];const timers={};setupSearch('startInput','startResults','start');setupSearch('endInput','endResults','end');requestInitialLocation();loadSpeedCameras();
function setupSearch(i,b,t){const input=document.getElementById(i),box=document.getElementById(b);input.onfocus=()=>{if(t==='start'&&gpsStart)input.select()};input.oninput=()=>{if(t==='start'){manualStartOverride=true;gpsStart=false;startPlace=null;if(startMarker){startMarker.remove();startMarker=null}}clearTimeout(timers[t]);let q=input.value.trim();if(q.length<2){box.style.display='none';return}timers[t]=setTimeout(()=>searchPlace(q,box,t),650)};input.onkeydown=e=>{if(e.key==='Enter')searchPlace(input.value.trim(),box,t)}}
async function searchPlace(q,box,type){box.innerHTML='<div class="item">搜尋中…</div>';box.style.display='block';let qs=buildQueries(q),places=[];try{for(const x of qs){let url='https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=tw&limit=10&addressdetails=1&accept-language=zh-TW&q='+encodeURIComponent(x),r=await fetch(url);if(r.ok)places.push(...await r.json());if(places.length>=6)break;await sleep(1050)}places=rankPlaces(places,q);if(!places.length){box.innerHTML='<div class="item">找不到「'+safe(q)+'」<div class="itemAddress">試試看輸入路名、門牌或店名</div></div>';return}box.innerHTML='';places.slice(0,8).forEach(p=>{let row=document.createElement('div'),title=p.name||getTitle(p)||q;row.className='item';row.innerHTML='<div class="itemTitle">'+safe(title)+'</div><div class="itemAddress">'+safe(shortAddress(p.display_name))+'</div>';row.onclick=()=>choosePlace(p,type,box,title);box.appendChild(row)})}catch(e){box.innerHTML='<div class="item">搜尋服務目前無法使用</div>'}}
function normalizeAddress(q){return q.trim().replace(/\s+/g,'').replaceAll('台中','臺中').replaceAll('台北','臺北').replaceAll('台南','臺南').replaceAll('台東','臺東').replace(/(\d+)號之(\d+)/g,'$1-$2號')}
function buildQueries(q){q=normalizeAddress(q);let a=[q];if(!/[縣市]/.test(q))a.push(q+' 台灣');return[...new Set(a)]}
function rankPlaces(items,q){let seen=new Set(),needle=normalizeAddress(q).toLowerCase();return items.filter(p=>{let k=(+p.lon).toFixed(5)+','+(+p.lat).toFixed(5);if(seen.has(k))return false;seen.add(k);return true}).map(p=>{let text=normalizeAddress((p.name||'')+(p.display_name||'')).toLowerCase(),score=text.includes(needle)?100:0;if(currentPos)score-=haversine(currentPos,[+p.lon,+p.lat])/5000;return{p,score}}).sort((a,b)=>b.score-a.score).map(x=>x.p)}
function shortAddress(s){return(s||'').replace(/, Taiwan$/,'').replace(/, 臺灣$/,'').split(', ').slice(0,5).join(' · ')}
function getTitle(p){let a=p.address||{};return a.amenity||a.shop||a.tourism||(a.road&&a.house_number?a.road+a.house_number:a.road||a.suburb||'')}
async function loadSpeedCameras(){try{let r=await fetch('https://opdadm.moi.gov.tw/api/v1/no-auth/resource/api/dataset/EA5E6FCD-B82D-43B7-A5CF-E9893253187E/resource/EBC2016C-5AEC-4B20-98B0-2A409E13A95C/download');if(!r.ok)return;let rows=parseCSV(await r.text()),head=rows.shift().map(x=>x.replace(/^\uFEFF/,''));speedCameras=rows.map(row=>{let d=Object.fromEntries(head.map((h,i)=>[h.trim().toLowerCase(),row[i]])),lng=+(d.longitude||d['經度']),lat=+(d.latitude||d['緯度']);return{lng,lat,limit:+(d.limit||d['速限'])||0,address:d.address||d['設置地址']||'固定測速'}}).filter(x=>Number.isFinite(x.lng)&&Number.isFinite(x.lat));drawSpeedCameras()}catch(e){speedCameras=[]}}
function parseCSV(text){let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}return rows}
function drawSpeedCameras(){if(!map.isStyleLoaded()){map.once('load',drawSpeedCameras);return}let data={type:'FeatureCollection',features:speedCameras.map(c=>({type:'Feature',properties:{limit:c.limit,address:c.address},geometry:{type:'Point',coordinates:[c.lng,c.lat]}}))};if(map.getSource('speed-cameras')){map.getSource('speed-cameras').setData(data);return}map.addSource('speed-cameras',{type:'geojson',data});map.addLayer({id:'speed-cameras',type:'circle',source:'speed-cameras',minzoom:11,paint:{'circle-radius':['interpolate',['linear'],['zoom'],11,3,16,7],'circle-color':'#ff9500','circle-stroke-color':'#fff','circle-stroke-width':2}})}
function choosePlace(p,type,box,title){let d={lng:+p.lon,lat:+p.lat,name:title};box.style.display='none';if(type==='start'){manualStartOverride=true;gpsStart=false;startPlace=d;startInput.value=title;if(startMarker)startMarker.remove();startMarker=new maplibregl.Marker({color:'#1683ff'}).setLngLat([d.lng,d.lat]).addTo(map)}else{endPlace=d;endInput.value=title;if(endMarker)endMarker.remove();endMarker=new maplibregl.Marker({color:'#ef4444'}).setLngLat([d.lng,d.lat]).addTo(map)}map.flyTo({center:[d.lng,d.lat],zoom:16})}

function requestInitialLocation(){
  const input=document.getElementById('startInput');
  input.value='📍 正在取得目前位置…';
  input.placeholder='📍 正在取得目前位置…';
  if(!navigator.geolocation){restoreManualStart();return}
  navigator.geolocation.getCurrentPosition(setInitialLocation,restoreManualStart,{enableHighAccuracy:true,maximumAge:15000,timeout:12000});
}
function setInitialLocation(pos){
  if(manualStartOverride)return;
  const c=pos.coords;
  currentPos=[c.longitude,c.latitude];
  startPlace={lng:c.longitude,lat:c.latitude,name:'目前位置'};
  gpsStart=true;
  startInput.value='📍 目前位置';
  startInput.placeholder='輸入起點';
  if(startMarker)startMarker.remove();
  startMarker=new maplibregl.Marker({color:'#1683ff'}).setLngLat(currentPos).addTo(map);
  map.flyTo({center:currentPos,zoom:16});
}
function restoreManualStart(){
  const input=document.getElementById('startInput');
  if(gpsStart||manualStartOverride)return;
  startPlace=null;
  input.value='';
  input.placeholder='輸入起點';
}

function setMode(v){mode=v;document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));document.getElementById(v).classList.add('active');if(v!=='car')toast('目前 '+(v==='motorcycle'?'機車':'步行')+'仍使用測試道路規劃')}
async function planRoute(fromGPS=false){if(!endPlace){toast('請先選擇目的地');return}if(!startPlace){toast('目前位置尚未取得，請輸入起點');return}let url='https://router.project-osrm.org/route/v1/driving/'+startPlace.lng+','+startPlace.lat+';'+endPlace.lng+','+endPlace.lat+'?overview=full&geometries=geojson&steps=true';try{let r=await fetch(url),d=await r.json();if(!d.routes?.length){toast('找不到路線');return}routeData=d.routes[0];routeCoordinates=routeData.geometry.coordinates;routeSteps=routeData.legs?.[0]?.steps||[];drawRoute();showInfo();if(fromGPS)updateNavInfo()}catch(e){toast('路線服務目前無法使用')}}
function drawRoute(){removeRoute();map.addSource('route',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:routeCoordinates}}});map.addLayer({id:'route-outline',type:'line',source:'route',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#fff','line-width':['interpolate',['linear'],['zoom'],12,7,18,18]}});map.addLayer({id:'route-line',type:'line',source:'route',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#1683ff','line-width':['interpolate',['linear'],['zoom'],12,4,18,12]}});map.addLayer({id:'route-arrows',type:'symbol',source:'route',layout:{'symbol-placement':'line','symbol-spacing':90,'text-field':'➤','text-size':20,'text-rotation-alignment':'map','text-keep-upright':false},paint:{'text-color':'#fff','text-halo-color':'#1683ff','text-halo-width':2}});fitRoute()}
function removeRoute(){['route-arrows','route-line','route-outline'].forEach(x=>{if(map.getLayer(x))map.removeLayer(x)});if(map.getSource('route'))map.removeSource('route')}
function showInfo(){time.textContent=Math.max(1,Math.round(routeData.duration/60))+' 分鐘';distance.textContent=(routeData.distance/1000).toFixed(1)+' 公里';desc.textContent='開車｜'+startPlace.name+' → '+endPlace.name;routeInfo.style.display='block'}
function fitRoute(){if(!routeCoordinates)return;let b=new maplibregl.LngLatBounds();routeCoordinates.forEach(p=>b.extend(p));map.fitBounds(b,{padding:document.body.classList.contains('navMode')?{top:140,right:35,bottom:150,left:35}:{top:260,right:45,bottom:80,left:45},duration:700})}
function startNavigation(){if(!routeCoordinates)return;document.body.classList.add('navMode');navUI.classList.add('on');remainTime.textContent=Math.max(1,Math.round(routeData.duration/60))+' 分鐘';remainDistance.textContent=(routeData.distance/1000).toFixed(1)+' 公里';if(!navigator.geolocation){gpsStatus.textContent='此裝置不支援 GPS';return}watchId=navigator.geolocation.watchPosition(onGPS,onGPSError,{enableHighAccuracy:true,maximumAge:1000,timeout:12000});toast('請允許 Safari 使用你的位置')}
function onGPS(pos){let c=pos.coords;currentPos=[c.longitude,c.latitude];gpsStatus.textContent='GPS ±'+Math.round(c.accuracy)+'m';if(Number.isFinite(c.speed)&&c.speed>=0)currentSpeed=c.speed*3.6;else if(window.prevPos&&window.prevGPSAt)currentSpeed=haversine(window.prevPos,currentPos)/Math.max(.5,(pos.timestamp-window.prevGPSAt)/1000)*3.6;speedValue.textContent=Math.round(Math.min(currentSpeed,299));if(Number.isFinite(c.heading))lastHeading=c.heading;else if(window.prevPos)lastHeading=getBearing(window.prevPos,currentPos);window.prevPos=currentPos;window.prevGPSAt=pos.timestamp;gpsCar.style.transform='rotate('+0+'deg)';map.easeTo({center:currentPos,zoom:17.5,pitch:58,bearing:lastHeading,padding:{top:100,bottom:window.innerHeight*.38,left:0,right:0},duration:700});updateNavInfo();updateCameraWarning();checkOffRoute()}
function updateCameraWarning(){if(!currentPos||!speedCameras.length)return;let best=null,bestD=Infinity;for(const c of speedCameras){let d=haversine(currentPos,[c.lng,c.lat]);if(d>1200||d>=bestD)continue;let bearing=getBearing(currentPos,[c.lng,c.lat]),delta=Math.abs(((bearing-lastHeading+540)%360)-180);if(currentSpeed>8&&delta>80)continue;best=c;bestD=d}if(!best){cameraAlert.classList.remove('on');speedometer.classList.remove('over');return}cameraAlert.textContent='📷 前方 '+Math.round(bestD/10)*10+' 公尺'+(best.limit?'｜速限 '+best.limit:'');cameraAlert.classList.toggle('on',bestD<800);speedometer.classList.toggle('over',!!best.limit&&currentSpeed>best.limit+3)}
function onGPSError(e){gpsStatus.textContent=e.code===1?'請到 iPhone 設定允許定位':'GPS 定位失敗';toast(gpsStatus.textContent)}
function updateNavInfo(){if(!currentPos||!routeSteps.length)return;let best=null,bestD=Infinity;routeSteps.forEach(s=>{let m=s.maneuver?.location;if(!m)return;let d=haversine(currentPos,m);if(d<bestD){bestD=d;best=s}});if(best){let type=best.maneuver?.type||'',mod=best.maneuver?.modifier||'';turnIcon.textContent=turnSymbol(type,mod);nextDist.textContent=bestD<1000?Math.max(10,Math.round(bestD/10)*10)+' 公尺':(bestD/1000).toFixed(1)+' 公里';nextRoad.textContent=best.name||maneuverText(type,mod)}let nearest=distanceToRoute(currentPos);let remain=Math.max(0,routeData.distance-nearest.progress);remainDistance.textContent=(remain/1000).toFixed(1)+' 公里';remainTime.textContent=Math.max(1,Math.round(routeData.duration*(remain/routeData.distance)/60))+' 分鐘'}
function checkOffRoute(){let n=distanceToRoute(currentPos);if(n.distance>55){nextDist.textContent='已偏離路線';nextRoad.textContent='正在重新規劃';startPlace={lng:currentPos[0],lat:currentPos[1],name:'目前位置'};clearTimeout(window.rerouteTimer);window.rerouteTimer=setTimeout(()=>planRoute(true),1200)}}
function distanceToRoute(p){let best=Infinity,index=0,total=0,progress=0;for(let i=1;i<routeCoordinates.length;i++){let seg=haversine(routeCoordinates[i-1],routeCoordinates[i]);total+=seg;let d=Math.min(haversine(p,routeCoordinates[i-1]),haversine(p,routeCoordinates[i]));if(d<best){best=d;index=i;progress=total}}return{distance:best,progress}}
function recenter(){if(currentPos)map.easeTo({center:currentPos,zoom:17.5,pitch:58,bearing:lastHeading,duration:500})}function stopNavigation(){if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;document.body.classList.remove('navMode');navUI.classList.remove('on');map.setPadding({top:0,bottom:0,left:0,right:0});fitRoute()}
function turnSymbol(t,m){if(t==='arrive')return'●';if(m==='left'||m==='sharp left'||m==='slight left')return'↰';if(m==='right'||m==='sharp right'||m==='slight right')return'↱';if(m==='uturn')return'↶';return'↑'}function maneuverText(t,m){if(t==='arrive')return'抵達目的地';if(m==='left')return'左轉';if(m==='right')return'右轉';if(m==='uturn')return'迴轉';return'繼續直行'}
function haversine(a,b){const R=6371000,toRad=x=>x*Math.PI/180,dLat=toRad(b[1]-a[1]),dLon=toRad(b[0]-a[0]),x=Math.sin(dLat/2)**2+Math.cos(toRad(a[1]))*Math.cos(toRad(b[1]))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x))}function getBearing(a,b){let l1=a[0]*Math.PI/180,p1=a[1]*Math.PI/180,l2=b[0]*Math.PI/180,p2=b[1]*Math.PI/180,y=Math.sin(l2-l1)*Math.cos(p2),x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(l2-l1);return(Math.atan2(y,x)*180/Math.PI+360)%360}function sleep(ms){return new Promise(r=>setTimeout(r,ms))}function toast(m){let e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),2400)}function safe(t){let d=document.createElement('div');d.textContent=t||'';return d.innerHTML}
</script></body></html>
